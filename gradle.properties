# Project-wide Gradle settings. No secrets here (this file is committed); secrets come from the
# environment (docs/TECHNICAL.md §3).
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Local build cache only. No remote or shared cache until Kotlin >= 2.4.20 (CVE-2026-53914,
# build-cache metadata deserialization; see config/dependency-check/suppressions.xml).
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Screenshot tests compare against the committed goldens in app/src/test/screenshots, so `check`
# fails on a visual change. Re-record deliberately: ./gradlew :app:recordRoborazziDebug
roborazzi.test.verify=true
