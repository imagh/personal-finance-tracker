# Overrides on top of detekt's default rule set (buildUponDefaultConfig = true).
# Keep this file small: every override needs a reason.

style:
  MagicNumber:
    # Tests use literal amounts and dates on purpose. The design tokens in ui/theme (colours now;
    # type, spacing and motion later) are named literals by definition, and `ui/theme` is the only
    # place raw design values are allowed (design plan §3.2).
    excludes: ['**/test/**', '**/androidTest/**', '**/testFixtures/**', '**/*.kts', '**/ui/theme/**']

complexity:
  LongParameterList:
    # A Compose component takes one defaulted parameter per slot (the Compose API guidelines); the
    # shared screen frame has more than six by design.
    ignoreAnnotated: ['Composable']

naming:
  FunctionNaming:
    # Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']
