# Local quality gates (CLAUDE.md §9). Install once, per clone:
#   pre-commit install && pre-commit install --hook-type pre-push
# Secret scanning and private-key detection enforce Rule C and must not be removed.
# The Gradle project exists since slice A1 (M1a-1): the commit hook runs ktlintFormat + detekt and
# the push hook runs `check` (tests, coverage floor, lint). The skip branches below only matter
# on a checkout without ./gradlew.

repos:
  # --- Secret scanning (Rule C: do not remove) ---
  # gitleaks-system runs the locally installed gitleaks (brew install gitleaks, pinned
  # to the rev below) instead of building it from source, which would pull a Go
  # toolchain into the pre-commit cache. Fails closed if gitleaks is not installed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        # Upstream omits this for the system variant; gitleaks scans the staged diff itself.
        pass_filenames: false

  # --- Basic hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # graphify-out/ is generated output, rewritten whole on every build.
      - id: end-of-file-fixer
        exclude: ^graphify-out/
      - id: trailing-whitespace
        exclude: ^graphify-out/
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files

  # --- Project gates ---
  - repo: local
    hooks:
      # Lint + format on COMMIT.
      - id: lint-format
        name: lint & format (ktlint + detekt)
        entry: bash -c 'if [ -x ./gradlew ]; then ./gradlew --quiet ktlintFormat detekt; else echo "no Gradle project yet, skipped"; fi'
        language: system
        files: \.(kt|kts)$
        pass_filenames: false
        stages: [pre-commit]

      # Full test suite on PUSH (coverage floor 90% on core modules, enforced in Gradle).
      - id: tests-gradle
        name: Gradle check (JUnit 5 + Kotest)
        entry: bash -c 'if [ -x ./gradlew ]; then ./gradlew check; else echo "no Gradle project yet, skipped"; fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: tests-tools
        name: tools/redact unit tests
        entry: python3 -m unittest discover -s tools/redact
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: tests-material-symbols
        name: tools/material-symbols unit tests
        entry: python3 -I -m unittest discover -s tools/material-symbols
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
